<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f6f7f5">
  <title>Lyra · A Moment for You</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="assets/RobotoCondensed.ttf" as="font" type="font/ttf" crossorigin>
  <script defer src="assets/lucide.min.js"></script>
  <script type="module" src="acknowledgment.mjs?v=3"></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="./">LYRA<span>STARLIGHT</span></a>
    <div class="header-actions"><span class="badge">CONCEPT STUDY</span>
      <a href="direction.html" class="plain-link">Design notes <i data-lucide="arrow-up-right"></i></a></div>
  </header>
  <main>
    <div class="title-row"><div><p class="eyebrow">ACTIVITY ACKNOWLEDGMENT / 03</p>
      <h1>A moment for you.</h1></div><span class="edition">3 scenes · 3 matched pairs</span></div>
    <form class="controls" id="controls" aria-label="Preview conditions">
      <fieldset class="activity"><legend>Recorded activity</legend>
        <div class="segments">
          <label><input type="radio" name="activity" value="walk"><span><i data-lucide="footprints"></i>Walk</span></label>
          <label><input type="radio" name="activity" value="run" checked><span><i data-lucide="activity"></i>Run</span></label>
          <label><input type="radio" name="activity" value="workout"><span><i data-lucide="dumbbell"></i>Workout</span></label>
        </div>
      </fieldset>
      <label class="amount-label" id="distance-control">Distance<div class="amount"><input id="amount" type="number" min="3" max="99" step="1" value="5" inputmode="numeric" aria-label="Activity distance"><span id="unit">km</span></div></label>
      <label id="workout-control" hidden><input id="workout-recorded" type="checkbox" checked> Garmin workout recorded</label>
      <div class="shared-actions">
        <button type="button" id="reset" class="icon-button" title="Reset all three watches" aria-label="Reset all three watches"><i data-lucide="rotate-ccw"></i></button>
        <button type="button" id="next-all" class="primary"><span>Acknowledge</span><i data-lucide="arrow-right"></i></button>
      </div>
    </form>
    <p id="validation" role="status" class="validation" hidden></p>
    <div id="loading" role="status">Loading artwork…</div>
    <section class="watches" id="watches" aria-label="Three matched acknowledgment scenes" hidden></section>
    <div class="below">
      <span><span class="status-dot"></span>Simulated activity · not connected to your watch</span>
      <a class="plain-link" href="earlier-study.html">Earlier reward study <i data-lucide="arrow-up-right"></i></a>
    </div>
  </main>
  <footer>Lyra: Starlight <span>Artwork &amp; reward exploration · not a release</span></footer>
  <noscript>This interactive preview requires JavaScript.</noscript>
</body>
</html>
